<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل النقلات</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--muted:#6b7280;--in:#0f766e;--out:#b45309;--line:#e5e7eb;--accent:#1d4ed8;--del:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#1a2028;--text:#eef0f3;--muted:#9aa3af;--in:#2dd4bf;--out:#fbbf24;--line:#2b333d;--accent:#60a5fa;--del:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#1a2028;--text:#eef0f3;--muted:#9aa3af;--in:#2dd4bf;--out:#fbbf24;--line:#2b333d;--accent:#60a5fa;--del:#f87171;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;max-width:520px;margin-inline:auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.date{display:flex;align-items:center;gap:8px}
.date .mid{flex:1;text-align:center}
.date .day{font-size:18px;font-weight:700}
.date .full{font-size:13px;color:var(--muted)}
.nav{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;width:44px;height:44px;font-size:20px}
input[type=date]{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
h2{font-size:15px;margin:0 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.o{grid-template-columns:repeat(3,1fr)}

.b{border:0;border-radius:14px;padding:16px 4px;font-size:22px;font-weight:700;color:#fff;touch-action:manipulation}
.b:active{transform:scale(.95)}
.b.in{background:var(--in)} .b.out{background:var(--out)}
:root:not([data-theme="light"]) .b{color:#fff}
.sum{display:flex;justify-content:space-around;text-align:center}
.sum .n{font-size:28px;font-weight:800}
.sum .l{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;color:#fff}
.tag.in{background:var(--in)}.tag.out{background:var(--out)}
.row .amt{font-weight:700;font-size:18px;flex:1}
.row .t{color:var(--muted);font-size:12px}
.x{border:0;background:none;color:var(--del);font-size:20px;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:10px}
.hist{width:100%;display:flex;justify-content:space-between;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--text);font-size:15px;text-align:start}
.hist:first-of-type{border-top:0}
.hist small{color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;border-top:2px solid var(--line);padding-top:10px;margin-top:6px}
.txt{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts{display:flex;gap:8px}
.act{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-weight:700}
.act.wa{background:#16a34a;color:#fff;border-color:#16a34a}
.msg{font-size:13px;color:var(--muted);text-align:center;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<h1>🚕 سجل النقلات</h1>

<div class="card">
  <div class="date">
    <button class="nav" id="next" aria-label="اليوم التالي">›</button>
    <div class="mid"><div class="day" id="dayName"></div><div class="full" id="dayFull"></div></div>
    <button class="nav" id="prev" aria-label="اليوم السابق">‹</button>
  </div>
  <input type="date" id="picker">
</div>

<div class="card">
  <h2>داخلي</h2>
  <div class="grid" id="gin"></div>
  <h2 style="margin-top:14px">خارجي</h2>
  <div class="grid o" id="gout"></div>
</div>

<div class="card">
  <div class="sum">
    <div><div class="n" id="cnt">0</div><div class="l">عدد النقلات</div></div>
    <div><div class="n" id="tot">0</div><div class="l">مجموع اليوم</div></div>
  </div>
</div>

<div class="card">
  <h2>نقلات هذا اليوم</h2>
  <div id="list"></div>
</div>

<div class='card'>
  <h2>إرسال التقرير</h2>
  <input type='text' id='nm' class='txt' placeholder='اسم الموظف (اختياري)'>
  <div class='seg'><button id='sd' class='on'>هذا اليوم</button><button id='sa'>كل الأيام</button></div>
  <textarea id='pv' class='txt' rows='7' readonly></textarea>
  <div class='acts'><button class='act wa' id='bwa'>واتساب</button><button class='act' id='bsh'>مشاركة</button><button class='act' id='bcp'>نسخ</button></div>
  <div class='msg' id='msg'></div>
</div>

<div class="card">
  <h2>الأيام السابقة</h2>
  <div id="hist"></div>
  <div class="total"><span>المجموع الكلي</span><span id="all">0</span></div>
</div>

<script>
var KEY='naqlat_v1', trips=[], cur=iso(new Date());
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function load(){try{trips=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){trips=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(trips))}catch(e){}}
function dt(s){return new Date(s+'T12:00:00')}
function fmt(s,o){return dt(s).toLocaleDateString('ar-u-nu-latn',o)}
function sum(a){return a.reduce(function(t,x){return t+x.amount},0)}
function add(kind,amount){
  var n=new Date(),h=n.getHours(),mi=n.getMinutes();
  trips.push({id:Date.now()+Math.random(),date:cur,kind:kind,amount:amount,time:(h<10?'0':'')+h+':'+(mi<10?'0':'')+mi});
  save();render();
  if(navigator.vibrate){try{navigator.vibrate(30)}catch(e){}}
}
function del(id){if(!confirm('حذف هذه النقلة؟'))return;trips=trips.filter(function(t){return t.id!==id});save();render()}
function shift(n){var d=dt(cur);d.setDate(d.getDate()+n);cur=iso(d);render()}
function mk(box,kind,vals,cls){
  var el=document.getElementById(box);
  vals.forEach(function(v){var b=document.createElement('button');b.className='b '+cls;b.textContent=v;b.onclick=function(){add(kind,v)};el.appendChild(b)});
}
function render(){
  document.getElementById('dayName').textContent=fmt(cur,{weekday:'long'});
  document.getElementById('dayFull').textContent=fmt(cur,{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('picker').value=cur;
  var day=trips.filter(function(t){return t.date===cur});
  document.getElementById('cnt').textContent=day.length;
  document.getElementById('tot').textContent=sum(day);
  var L=document.getElementById('list');L.innerHTML='';
  if(!day.length){L.innerHTML='<div class="empty">لا توجد نقلات في هذا اليوم</div>'}
  day.slice().reverse().forEach(function(t){
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<span class="tag '+(t.kind==='داخلي'?'in':'out')+'">'+t.kind+'</span><span class="amt">'+t.amount+'</span><span class="t">'+t.time+'</span>';
    var x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','حذف');x.onclick=function(){del(t.id)};
    r.appendChild(x);L.appendChild(r);
  });
  var days={};trips.forEach(function(t){(days[t.date]=days[t.date]||[]).push(t)});
  var keys=Object.keys(days).sort().reverse();
  var H=document.getElementById('hist');H.innerHTML='';
  if(!keys.length)H.innerHTML='<div class="empty">لا يوجد سجل بعد</div>';
  keys.forEach(function(k){
    var b=document.createElement('button');b.className='hist';
    b.innerHTML='<span>'+fmt(k,{weekday:'long',day:'numeric',month:'numeric'})+' <small>('+days[k].length+' نقلات)</small></span><b>'+sum(days[k])+'</b>';
    b.onclick=function(){cur=k;render();window.scrollTo(0,0)};
    H.appendChild(b);
  });
  document.getElementById('all').textContent=sum(trips);
  preview();
}
var scope='day',NK='naqlat_name';
function getName(){try{return localStorage.getItem(NK)||''}catch(e){return ''}}
function report(){
  var L=['🚕 تقرير النقلات'],nm=getName();
  if(nm)L.push('الاسم: '+nm);
  var days={};trips.forEach(function(t){(days[t.date]=days[t.date]||[]).push(t)});
  var keys=scope==='day'?[cur]:Object.keys(days).sort();
  keys.forEach(function(k){
    var d=days[k]||[];
    L.push('');L.push('📅 '+fmt(k,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
    if(!d.length){L.push('لا توجد نقلات');return}
    d.forEach(function(t){L.push('• '+t.kind+' '+t.amount)});
    L.push('عدد النقلات: '+d.length+' — المجموع: '+sum(d));
  });
  if(scope==='all'&&keys.length>1){L.push('');L.push('المجموع الكلي: '+sum(trips)+' ('+trips.length+' نقلات)')}
  return L.join('\n');
}
function preview(){document.getElementById('pv').value=report()}
function say(m){document.getElementById('msg').textContent=m}
function copyTxt(){
  var txt=report();
  function fb(){var p=document.getElementById('pv');p.select();try{document.execCommand('copy');say('تم النسخ ✓')}catch(e){say('حدد النص أعلاه وانسخه يدوياً')}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){say('تم النسخ ✓')},fb)}else fb();
}
document.getElementById('nm').value=getName();
document.getElementById('nm').oninput=function(e){try{localStorage.setItem(NK,e.target.value)}catch(x){}preview()};
document.getElementById('sd').onclick=function(){scope='day';this.className='on';document.getElementById('sa').className='';preview()};
document.getElementById('sa').onclick=function(){scope='all';this.className='on';document.getElementById('sd').className='';preview()};
document.getElementById('bwa').onclick=function(){var w=window.open('https://wa.me/?text='+encodeURIComponent(report()),'_blank');if(!w){say('تعذر فتح واتساب، استخدم زر النسخ')}};
document.getElementById('bsh').onclick=function(){
  if(navigator.share){navigator.share({text:report()}).catch(function(){})}else copyTxt();
};
document.getElementById('bcp').onclick=copyTxt;
document.getElementById('prev').onclick=function(){shift(-1)};
document.getElementById('next').onclick=function(){shift(1)};
document.getElementById('picker').onchange=function(e){if(e.target.value){cur=e.target.value;render()}};
mk('gin','داخلي',[0,5,7,10],'in');
mk('gout','خارجي',[10,12,13,15,20,40],'out');
load();render();
</script>
</body>
</html>
